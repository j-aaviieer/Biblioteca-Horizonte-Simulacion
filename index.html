<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Javier Colque">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="static/css/style.css">
    <title>Biblioteca Horizontal</title>
</head>
<body>
    <header>
        <nav>
            <div class="nav-bar-left">
                <img src="static/images/logo.png" alt="logo">
                <h1>Biblioteca <span>Horizonte</span></h1>
            </div>
            <div class="nav-bar-right">
                <div class="login-container" id="loginContainer">
                    <input type="email" placeholder="Email" required class="email" id="login"/>
                    <button type="button" class="login-button" id="loginButton">Ingresar</button>
                </div>
                <div class="cart-container">
                    <i class="fa-solid fa-book fa-2xl"></i>
                    <p id="foodCounter">0</p>
                </div>
            </div>
        </nav>
    </header>
    <script src="static/js/script.js"></script>
</body>
</html>
