<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Javier Colque">
    <title>Taco Palace</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <header>
        <nav class="nav-bar">
            <div class="title-container">
                <img src="static/images/logo.png" alt="logo" class="logo" />
                <h1>Biblioteca <span>Horizonte</span></h1>
            </div>
            <div class="nav-bar-actions">
                <div class="login-container" id="loginContainer">
                    <input type="email" placeholder="Email" required class="email" id="login"/>
                    <button type="button" class="login-button" id="loginButton">Ingresar</button>
                </div>
                <div class="books-container">
                    <img src="static/images/books.png" alt="books" class="books" />
                    <p>Libros<br> seleccionados:</p>
                    <p id="booksCounter">0</p>
                </div>
            </div>
        </nav>
    </header>
<!------------------------------------------------------------------------------------------->
    <main>
        <div class="section-arriba">
            <div class="type-container">
                <div class="tarjeta-type">
                    <img src="static/images/logo.png" alt="novelas" class="novelas"/>
                    <p>Novelas</p>
                </div>
                <div class="tarjeta-type">
                    <img src="static/images/botella.png" alt="ciencia" class="ciencia"/>
                    <p>Ciencia</p>
                </div>
                <div class="tarjeta-type">
                    <img src="static/images/ayuntamiento.png" alt="ayuntamiento" class="ayuntamiento"/>
                    <p>Historia</p>
                </div>
                <div class="tarjeta-type">
                    <img src="static/images/pintura.png" alt="pintura" class="pintura"/>
                    <p>Pintura</p>
                </div>
                <div class="tarjeta-type">
                    <img src="static/images/laptop.png" alt="tecnologia" class="tecnologia"/>
                    <p>Tecnología</p>
                </div>
                <div class="tarjeta-type">
                    <img src="static/images/peluche.png" alt="peluche" class="peluche"/>
                    <p>Infantil</p>
                </div>
            </div>
        </div>
<!-------------------------------------------------------------------------------------------->
        <div class="section-abajo">
            <div class="section-left">
                <div class="section-left-text">
                    <div>
                        <h2 class="section-left-title">La mejor variedad en platillos de comida <span class="mexicana">mexicana</span></h2>
                    </div>
                    <div>
                        <h3 class="section-left-subtitle">Contamos con <a href="#"><span class="servicio">servicio</span></a> a <span class="domicilio">domicilio</span></h3>
                    </div>
                </div>
                <div id="imageContainer">
                    <img src="static/images/comida-mexicana.jpg" alt="section-left-image" class="section-left-image"/>
                </div>
            </div>
<!-------------------------------------------------------------------------------------------->
            <section class="section-right">
                <h2>Recomendados:</h2>
                <div class="tarjeta">
                    <img src="static/images/orden-tacos.jpg" alt="orden-tacos" class="section-right-image"/>
                    <div class="orders">
                        <div>
                            <p>Orden de Tacos</p>
                            <a href="#">Ver Más...</a>
                        </div>
                        <div>
                            <button class="order-button" id="orderButton">+</button>
                        </div>
                    </div>
                </div>
                <div class="tarjeta">
                    <img src="static/images/orden-flautas.jpg" alt="orden-flautas" class="section-right-image"/>
                    <div class="orders">
                        <div>
                            <p>Orden de Flautas</p>
                            <a href="#">Ver Más...</a>
                        </div>
                        <div>
                            <button class="order-button" id="orderButton2">+</button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script src="static/js/script.js"></script>
</body>

</html>
